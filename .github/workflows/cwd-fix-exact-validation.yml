name: cwd-fix exact v0.10.0 validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cwd-fix-exact-validation.yml

permissions:
  contents: read

jobs:
  exact-v0100-make-check:
    name: exact v0.10.0 patch make check
    if: github.repository == 'SailorJoe6/prime-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9c1bd74fa87ddd251f57c4adc5c0a1f01e2ac114
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          components: rustfmt, clippy
      - name: Install uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the authoritative workspace gate
        run: make check
